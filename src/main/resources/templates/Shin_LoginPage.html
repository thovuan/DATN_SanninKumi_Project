<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Đăng Nhập</title>

    <!-- Consolidated CSS imports -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" crossorigin="">
    <link rel="stylesheet" th:href="@{/css/loginstyle.css}">

    <style>
        .login-with-google-btn {
            transition: background-color .3s, box-shadow .3s;
            padding: 12px 16px 12px 42px;
            border: none;
            border-radius: 3px;
            box-shadow: 0 -1px 0 rgba(0, 0, 0, .04), 0 1px 1px rgba(0, 0, 0, .25);
            color: #757575;
            font-size: 14px;
            font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
            background-image: url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTgiIGhlaWdodD0iMTgiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGcgZmlsbD0ibm9uZSIgZmlsbC1ydWxlPSJldmVub2RkIj48cGF0aCBkPSJNMTcuNiA5LjJsLS4xLTEuOEg5djMuNGg0LjhDMTMuNiAxMiAxMyAxMyAxMiAxMy42djIuMmgzYTguOCA4LjggMCAwIDAgMi42LTYuNnoiIGZpbGw9IiM0Mjg1RjQiIGZpbGwtcnVsZT0ibm9uemVybyIvPjxwYXRoIGQ9Ik05IDE4YzIuNCAwIDQuNS0uOCA2LTIuMmwtMy0yLjJhNS40IDUuNCAwIDAgMS04LTIuOUgxVjEzYTkgOSAwIDAgMCA4IDV6IiBmaWxsPSIjMzRBODUzIiBmaWxsLXJ1bGU9Im5vbnplcm8iLz48cGF0aCBkPSJNNCAxMC43YTUuNCA1LjQgMCAwIDEgMC0zLjRWNUgxYTkgOSAwIDAgMCAwIDhsMy0yLjN6IiBmaWxsPSIjRkJCQzA1IiBmaWxsLXJ1bGU9Im5vbnplcm8iLz48cGF0aCBkPSJNOSAzLjZjMS4zIDAgMi41LjQgMy40IDEuM0wxNSAyLjNBOSA5IDAgMCAwIDEgNWwzIDIuNGE1LjQgNS40IDAgMCAxIDUtMy43eiIgZmlsbD0iI0VBNDMzNSIgZmlsbC1ydWxlPSJub256ZXJvIi8+PHBhdGggZD0iTTAgMGgxOHYxOEgweiIvPjwvZz48L3N2Zz4=);
            background-color: white;
            background-repeat: no-repeat;
            background-position: 12px 11px;
            margin-top: 15px;
            width: 100%;
            display: block;
        }

        .login-with-google-btn:hover {
            box-shadow: 0 -1px 0 rgba(0, 0, 0, .04), 0 2px 4px rgba(0, 0, 0, .25);
        }

        .login-with-google-btn:active {
            background-color: #eeeeee;
        }

        .login-with-google-btn:focus {
            outline: none;
            box-shadow:
                    0 -1px 0 rgba(0, 0, 0, .04),
                    0 2px 4px rgba(0, 0, 0, .25),
                    0 0 0 3px #c8dafc;
        }

        .login-with-google-btn:disabled {
            filter: grayscale(100%);
            background-color: #ebebeb;
            box-shadow: 0 -1px 0 rgba(0, 0, 0, .04), 0 1px 1px rgba(0, 0, 0, .25);
            cursor: not-allowed;
        }

        .or-divider {
            display: flex;
            align-items: center;
            margin: 15px 0;
            color: var(--white-color);
        }

        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid hsla(0, 0%, 100%, .4);
        }

        .or-divider span {
            padding: 0 10px;
            font-size: var(--small-font-size);
        }
    </style>
</head>
<body>
<div class="login">
    <img th:src="@{/PIC_INTRO/login-bg.png}" alt="Login Background" class="login__bg">

    <!-- Bỏ action form và thêm id -->
    <form id="loginForm" class="login__form">
        <h4 class="login__title2">WEB AI - HO TRO NGUOI DUNG GIAO TIEP TIENG NHAT</h4>
        <h2 class="login__title">Đăng nhập</h2>
        <hr class="colorgraph">

        <!-- Thêm div hiển thị lỗi -->
        <div id="error-message" class="alert alert-danger" style="display: none;" role="alert"></div>

        <div class="login__inputs">
            <div class="login__box">
                <input type="text" id="username" class="login__input" placeholder="Tên Đăng Nhập" required>
            </div>

            <div class="login__box">
                <input type="password" id="password" class="login__input" placeholder="Mật Khẩu" required>
            </div>
        </div>

        <div class="login__check">
            <div class="login__check-box">
                <input type="checkbox" class="login__check-input" id="user-check">
                <label for="user-check" class="login__check-label">Remember me</label>
            </div>

            <a th:href="@{/Identity/Guest/ChangePassword}" class="login__forgot">
                Change Password
            </a>
        </div>

        <button type="submit" class="login__button">Login</button>

        <div class="login__register">
            Don't have an account?
            <a th:href="@{/Identity/Guest/NewUser}">Register new Account</a>
        </div>

        <div class="or-divider">
            <span>OR</span>
        </div>

        <!-- Google Sign-in button inside the form -->
        <a th:href="@{/oauth2/authorization/google}" class="login-with-google-btn">
            Sign in with Google
        </a>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                }),
                credentials: 'include'
            })
                .then(response => {
                    // Kiểm tra contentType trước khi parse JSON
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        return response.json().then(data => {
                            return { status: response.status, data: data };
                        });
                    } else {
                        // Nếu không phải JSON, chỉ trả về status
                        return { status: response.status, data: null };
                    }
                })
                .then(result => {
                    if (result.status === 200 && result.data && result.data.token) {
                        // Đăng nhập thành công
                        window.location.href = '/home';
                    } else {
                        // Xử lý lỗi
                        const errorMessage = document.getElementById('error-message');
                        if (errorMessage) {
                            errorMessage.style.display = 'block';
                            errorMessage.textContent = result.data ? result.data.message : 'Đăng nhập thất bại';
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    const errorMessage = document.getElementById('error-message');
                    if (errorMessage) {
                        errorMessage.style.display = 'block';
                        errorMessage.textContent = 'Có lỗi xảy ra khi xử lý đăng nhập';
                    }
                });
        });
    </script>
</div>
</body>
</html>
